spring.application.name=job-application-service



# Ensure you are actually connecting to your intended DB (Postgres/MySQL/H2)
spring.datasource.url=jdbc:postgresql://localhost:5432/job_application
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#JWT configuration
jwt.secret=jobApplicationServiceSuperSecretJwtKey1234567890
jwt.expiration=86400000

#Cv upload path
cv.storage.path=D:/jobapp/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

profile.image.storage.path=D:/jobapp/uploads/profile-images